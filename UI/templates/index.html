<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictions Dashboard</title>
    <style>
        .machine-status {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .status-label {
            font-weight: bold;
        }
        .schedule-container {
            margin-top: 20px;
        }
        .schedule-item {
            margin-bottom: 5px;
        }
        .schedule-label {
            font-weight: bold;
        }
    </style>
    <script>
        async function fetchStatus() {
            try {
                const response = await fetch('/status');
                const status = await response.json();
                updateStatus(status);
            } catch (error) {
                console.error('Error fetching status:', error);
            }
        }

        async function fetchSchedule() {
            try {
                const response = await fetch('/schedule');
                const schedule = await response.json();
                updateSchedule(schedule);
            } catch (error) {
                console.error('Error fetching schedule:', error);
            }
        }

        function updateStatus(status) {
            const statusContainer = document.getElementById('statusContainer');
            statusContainer.innerHTML = ''; // Clear previous content

            for (const [machine_id, color] of Object.entries(status)) {
                const statusElement = document.createElement('div');
                statusElement.className = 'machine-status';

                const indicator = document.createElement('div');
                indicator.className = 'status-indicator';
                indicator.style.backgroundColor = color;

                const label = document.createElement('span');
                label.className = 'status-label';
                label.innerText = `Machine ${machine_id}`;

                statusElement.appendChild(indicator);
                statusElement.appendChild(label);

                statusContainer.appendChild(statusElement);
            }
        }

        function updateSchedule(schedule) {
            const scheduleContainer = document.getElementById('scheduleContainer');
            scheduleContainer.innerHTML = ''; // Clear previous content

            schedule.forEach((item, index) => {
                const scheduleElement = document.createElement('div');
                scheduleElement.className = 'schedule-item';

                const label = document.createElement('span');
                label.className = 'schedule-label';
                label.innerText = `Machine ${item.machine_id} - Probability: ${item.probability.toFixed(2)}%`;

                scheduleElement.appendChild(label);
                scheduleContainer.appendChild(scheduleElement);
            });
        }

        async function startStream() {
            try {
                const response = await fetch('/start', { method: 'POST' });
                const result = await response.json();
                console.log('Start response:', result.status);
                fetchStatus(); // Fetch initial status after starting the stream
                fetchSchedule(); // Fetch initial schedule after starting the stream
            } catch (error) {
                console.error('Error starting stream:', error);
            }
        }

        async function stopStream() {
            try {
                const response = await fetch('/stop', { method: 'POST' });
                const result = await response.json();
                console.log('Stop response:', result.status);
            } catch (error) {
                console.error('Error stopping stream:', error);
            }
        }

        window.onload = function() {
            setInterval(fetchStatus, 5000); // Fetch status every 5 seconds
            setInterval(fetchSchedule, 5000); // Fetch schedule every 5 seconds
        };
    </script>
</head>
<body>
    <h1>Predictions Dashboard</h1>
    <div id="statusContainer">Loading...</div>
    <div class="schedule-container">
        <h2>Maintenance Schedule</h2>
        <div id="scheduleContainer">Loading...</div>
    </div>
    <button onclick="startStream()">Start Stream</button>
    <button onclick="stopStream()">Stop Stream</button>
</body>
</html>
