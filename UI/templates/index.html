<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictions Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-size: 48px; /* Doubled the font size */
            color: #0044cc;
            text-shadow: 1px 1px 2px #aaa;
            margin-bottom: 20px;
        }
        .buttons-container {
            margin-bottom: 20px;
        }
        .buttons-container button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
            margin-right: 10px;
        }
        .buttons-container button:hover {
            background-color: #0056b3;
        }
        .loading-message {
            font-size: 18px;
            color: #777;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        thead {
            background-color: #007bff;
            color: white;
        }
        thead th {
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
        }
        tbody tr {
            border-bottom: 1px solid #ddd;
            transition: background-color 0.3s;
        }
        tbody tr:hover {
            background-color: #f1f1f1;
        }
        tbody td {
            padding: 12px 15px;
            font-size: 14px;
            color: #555;
        }
        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid black; /* Added black border */
        }
    </style>
    <script>
        async function fetchStatus() {
            try {
                const response = await fetch('/status');
                const status = await response.json();
                updateTable(status);
            } catch (error) {
                console.error('Error fetching status:', error);
            }
        }

        function updateTable(status) {
            const tableBody = document.getElementById('statusTableBody');
            const loadingMessage = document.getElementById('loadingMessage');

            if (status.length === 0) {
                tableBody.innerHTML = ''; // Clear previous content if no data is received
            } else {
                loadingMessage.style.display = 'none'; // Hide loading message
                tableBody.innerHTML = ''; // Clear previous content

                status.forEach(item => {
                    const row = document.createElement('tr');

                    const statusCell = document.createElement('td');
                    const statusIndicator = document.createElement('div');
                    statusIndicator.className = 'status-indicator';
                    statusIndicator.style.backgroundColor = item.color;
                    statusCell.appendChild(statusIndicator);

                    const machineIdCell = document.createElement('td');
                    machineIdCell.innerText = item.machine_id;

                    const probabilityCell = document.createElement('td');
                    probabilityCell.innerText = (item.failure_probability * 100).toFixed(2) + '%';

                    row.appendChild(statusCell);
                    row.appendChild(machineIdCell);
                    row.appendChild(probabilityCell);

                    tableBody.appendChild(row);
                });
            }
        }

        async function startStream() {
            try {
                const response = await fetch('/start', { method: 'POST' });
                const result = await response.json();
                console.log('Start response:', result.status);
                fetchStatus(); // Fetch initial status after starting the stream
            } catch (error) {
                console.error('Error starting stream:', error);
            }
        }

        async function stopStream() {
            try {
                const response = await fetch('/stop', { method: 'POST' });
                const result = await response.json();
                console.log('Stop response:', result.status);
            } catch (error) {
                console.error('Error stopping stream:', error);
            }
        }

        window.onload = function() {
            setInterval(fetchStatus, 5000); // Fetch status every 5 seconds
        };
    </script>
</head>
<body>
    <h1>Predictions Dashboard</h1>
    <div class="buttons-container">
        <button onclick="startStream()">Start Stream</button>
        <button onclick="stopStream()">Stop Stream</button>
    </div>
    <div id="loadingMessage" class="loading-message">Fetching data, wait a few seconds more...</div>
    <table>
        <thead>
            <tr>
                <th>Status</th>
                <th>Machine ID</th>
                <th>Probability of Failure</th>
            </tr>
        </thead>
        <tbody id="statusTableBody">
            <!-- Dynamic content goes here -->
        </tbody>
    </table>
</body>
</html>
