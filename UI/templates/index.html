<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Monitoring Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
        }
        .status-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .status-green {
            background-color: green;
        }
        .status-yellow {
            background-color: yellow;
        }
        .status-red {
            background-color: red;
        }
        .button {
            padding: 10px 20px;
            margin: 10px 5px;
            font-size: 16px;
            cursor: pointer;
        }
        #status-container {
            margin-top: 20px;
        }
        .machine-data {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Machine Monitoring Dashboard</h1>
        
        <button class="button" onclick="startPublishing()">Start</button>
        <button class="button" onclick="stopPublishing()">Stop</button>

        <h3>Restart Machine</h3>
        <input type="number" id="machine-id" placeholder="Enter machine ID" min="1" max="25">
        <button class="button" onclick="restartMachine()">Restart Machine</button>

        <h3>Machine Status</h3>
        <div id="status-container"></div>
    </div>

    <script>
        function startPublishing() {
            fetch('/start', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert('Publishing started: ' + JSON.stringify(data)))
                .catch(error => console.error('Error:', error));
        }

        function stopPublishing() {
            fetch('/stop', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert('Publishing stopped: ' + JSON.stringify(data)))
                .catch(error => console.error('Error:', error));
        }

        function restartMachine() {
            const machineId = document.getElementById('machine-id').value;
            if (!machineId) {
                alert('Please enter a machine ID');
                return;
            }

            fetch('/restart_machine', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ machine_id: parseInt(machineId) })
            })
            .then(response => response.json())
            .then(data => alert('Machine restarted: ' + JSON.stringify(data)))
            .catch(error => console.error('Error:', error));
        }

        function fetchStatus() {
            fetch('/data')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('status-container');
                    container.innerHTML = '';

                    Object.keys(data).forEach(machine_id => {
                        const machine = data[machine_id];
                        const statusColor = machine.status === "failed" ? "red" : "green";

                        const div = document.createElement('div');
                        div.classList.add('machine-data');
                        div.innerHTML = `
                            <div>
                                <span class="status-indicator status-${statusColor}"></span>
                                <strong>Machine ${machine_id}</strong>
                            </div>
                            <div>Temperature: ${machine.temperature.toFixed(2)} °C</div>
                            <div>Pressure: ${machine.pressure.toFixed(2)} Pa</div>
                            <div>Vibration: ${machine.vibration.toFixed(2)} mm/s</div>
                            <div>Status: ${machine.status}</div>
                        `;
                        container.appendChild(div);
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        // Fetch status every 5 seconds
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
